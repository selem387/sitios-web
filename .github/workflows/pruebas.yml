# Corre las pruebas del backend en cada PR y en cada cambio a main.
# La prueba de punta a punta (test/e2e.test.js) se salta sola porque necesita el servidor encendido.
name: Pruebas
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
