server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  error_page 404 /404.html;

  # Canonical sin www
  if ($host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }

  # Rutas antiguas
  location = /terminos { return 301 /terminos/; }
  location = /privacidad { return 301 /privacidad/; }

  location / { try_files $uri $uri/ =404; }
  location /assets/ig/ { add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "no-store"; }
  location /assets/ { expires 30d; add_header Cache-Control "public, max-age=2592000"; }
  location ~* \.(txt|xml)$ { add_header Cache-Control "public, max-age=3600"; }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml text/plain application/xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
